baseURL: "https://blog.pyptechlife.xyz/"
languageCode: "fr-fr"
title: "PypTech Chronicles"
theme: "stack"

# Configurations de base pour Hugo
enableEmoji: true
enableGitInfo: false

# Configuration des taxonomies
taxonomies:
  category: "categories"
  tag: "tags"
  series: "series" # Ajout pour les séries d'articles

# Configuration du rendu Markdown
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# Configuration des outputs
outputs:
  home: ["HTML", "RSS", "JSON"]

# Configuration des permaliens
permalinks:
  linux: "/linux/:sections/:filename/"
  conteneurs: "/conteneurs/:sections/:filename/"
  projets: "/projets/:sections/:filename/"
  archives: "/archives/:sections/:filename/"

# Configuration du menu principal (Navbar)
menu:
  main:
    - name: "Accueil"
      url: "/"
      weight: 1
    - name: "Linux"
      url: "/linux/"
      weight: 2
    - name: "Conteneurs"
      url: "/conteneurs/"
      weight: 3
    - name: "Projets"
      url: "/projets/"
      weight: 4
    - name: "Archives"
      url: "/archives/"
      weight: 5
    - name: "Recherche"
      url: "/search/"
      weight: 6
    - name: "Qui suis-je"
      url: "/whoami/"
      weight: 7
    - name: "Mentions légales"
      url: "/mentions-legales/"
      weight: 8

# Paramètres personnalisés
params:
  mainSections:
    - linux
    - conteneurs
    - projets
    - archives

  # Le reste de vos paramètres reste identique
  customCSS:
    - css/custom.css
  article:
    image:
      enabled: true
      featuredImageField: "image"
  author:
    name: "PypTech Chronicles"
    bio: "Blog sur Linux, Réseau, DevOps et la reconversion dans l'IT."
    avatar: "images/avatar.webp"
  description: "Découvrez des articles techniques sur les technologies Linux, DevOps, et Réseau."
  social:
    twitter: "https://twitter.com/yourprofile"
    github: "https://github.com/yourprofile"
    linkedin: "https://linkedin.com/in/yourprofile"
    email: "mailto:votre-email@example.com"

  # Les widgets restent identiques
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 6
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 20

  # La configuration de la recherche reste identique
  search:
    enable: true
    placeholder: "Rechercher..."
  sidebar:
    compact: false
    emoji: "🔍"
    subtitle: "Explorez mes articles"
    custom: true
  avatar:
    enabled: false
    local: true
    src: "images/avatar.webp"

  # Les tags principaux
  tags:
    - linux
    - virtualisation
    - kubernetes
    - docker
    - cloud

# Configuration pour la gestion des dates de modification
frontmatter:
  lastmod: ["lastmod", ":git", "date", "publishDate"]
